function calcRSI(closes,p=14){
 let g=0,l=0;for(let i=1;i<=p;i++){let d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d;}
 let ag=g/p, al=l/p;for(let i=p+1;i<closes.length;i++){let d=closes[i]-closes[i-1];if(d>=0){ag=(ag*(p-1)+d)/p;al=(al*(p-1))/p;}else{ag=(ag*(p-1))/p;al=(al*(p-1)-d)/p;}}
 if(al===0)return 100;return 100-(100/(1+ag/al));
}

function drawCandles(candles){
 let canvas=document.getElementById('candleCanvas');
 let ctx=canvas.getContext('2d');
 let W=canvas.width, H=canvas.height;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
 if(candles.length===0)return;
 let highs=candles.map(c=>c.high), lows=candles.map(c=>c.low);
 let maxH=Math.max(...highs), minL=Math.min(...lows), range=maxH-minL;
 let pad=range*0.1; maxH+=pad; minL-=pad; range=maxH-minL;
 let candleW=W/candles.length*0.7;
 candles.forEach((c,i)=>{
  let x=i*(W/candles.length)+4;
  let yOpen=H-(c.open-minL)/range*H;
  let yClose=H-(c.close-minL)/range*H;
  let yHigh=H-(c.high-minL)/range*H;
  let yLow=H-(c.low-minL)/range*H;
  let isGreen=c.close>=c.open;
  ctx.strokeStyle=isGreen?"#00C853":"#ff1744";
  ctx.fillStyle=isGreen?"#00C853":"#ff1744";
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+candleW/2,yHigh); ctx.lineTo(x+candleW/2,yLow); ctx.stroke();
  let bodyY=Math.min(yOpen,yClose), bodyH=Math.abs(yOpen-yClose); if(bodyH<2)bodyH=2;
  ctx.fillRect(x,bodyY,candleW,bodyH);
 });
 // grid
 ctx.strokeStyle="#222"; ctx.setLineDash([2,3]);
 for(let i=0;i<4;i++){let y=H/4*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();}
 ctx.setLineDash([]);
}
