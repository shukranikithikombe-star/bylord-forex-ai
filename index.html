<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYLORD SNIPER</title>
<style>
body{background:#080e22;color:#fff;font-family:Arial;margin:0;padding:10px}
.top{display:flex;gap:6px}
.top button{flex:1;padding:11px;border-radius:20px;border:2px solid #333;background:#141d38;color:#888;font-weight:900;font-size:11px}
.top button.active{border-color:#00E676;color:#00E676;background:#0f2218}
select{width:100%;padding:12px;background:#141d38;color:#fff;border-radius:12px;border:1px solid #263154;margin:10px 0}
.sig{padding:20px;border-radius:18px;font-size:26px;font-weight:900;text-align:center;margin:8px 0}
.buy{background:#00E676;color:#000}.sell{background:#ff1744;color:#fff}.wait{background:#ffb300;color:#000}
#wrap{background:#000;border-radius:18px;border:1px solid #222;padding:6px;margin:8px 0}
#c{width:100%;height:340px;display:block;border-radius:12px}
.row{display:flex;gap:8px;margin:8px 0}.row div{flex:1;background:#141b33;padding:11px;border-radius:12px;text-align:center}
.row b{display:block;font-size:17px}.row span{font-size:10px;color:#888}
.tpbox{background:#141b33;padding:12px;border-radius:12px;text-align:center;font-size:12px;line-height:18px;margin:8px 0}
.entry{border:1px dashed #00E676;background:#0a1a12;padding:10px;border-radius:12px;margin:8px 0;font-size:12px}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:15px;margin-top:8px}
.wa{background:#25D366;color:#fff}.scan{background:#2a64ff;color:#fff}
</style></head><body>
<div class="top">
<button id="b1" class="active" onclick="setMode('scalper')">🎯 SCALPER</button>
<button id="b2" onclick="setMode('sniper')">🎯 SNIPER ENTRY</button>
</div>
<select id="pair" onchange="get()"><option value="PAXGUSDT">GOLD XAU/USD</option><option value="BTCUSDT">BTC/USD</option><option value="EURUSDT">EUR/USD</option><option value="GBPUSDT">GBP/USD</option></select>
<div id="sig" class="sig buy">LOADING...</div>
<div id="wrap"><canvas id="c" width="360" height="340"></canvas></div>
<div class="row"><div><b id="p">-</b><span>PRICE</span></div><div><b id="r">-</b><span>RSI</span></div><div><b id="cf">-</b><span>SNIPER SCORE</span></div></div>
<div id="entry" class="entry">Waiting for sniper setup...</div>
<div id="lv" class="tpbox"></div>
<button class="btn wa" onclick="wa()">📲 SEND ENTRY</button>
<button class="btn scan" onclick="get()">🔄 NEW SNIPER SCAN</button>
<script>
let mode='scalper',last={};
function setMode(m){mode=m;document.getElementById('b1').classList.toggle('active',m=='scalper');document.getElementById('b2').classList.toggle('active',m=='sniper');get();}
function calc(cs){let g=0,l=0;for(let i=1;i<=14;i++){let d=cs[i]-cs[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/14,al=l/14;for(let i=15;i<cs.length;i++){let d=cs[i]-cs[i-1];if(d>=0){ag=(ag*13+d)/14;al=al*13/14;}else{ag=ag*13/14;al=(al*13-d)/14;}}if(al==0)return 100;return 100-(100/(1+ag/al));}
function draw(cs){let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(!cs.length)return;let mx=Math.max(...cs.map(c=>c.h)),mn=Math.min(...cs.map(c=>c.l)),rg=mx-mn||1;mx+=rg*0.08;mn-=rg*0.08;rg=mx-mn;let st=W/cs.length,w=st*0.6;cs.forEach((c,i)=>{let x=i*st+4;let yO=H-(c.o-mn)/rg*H,yC=H-(c.c-mn)/rg*H,yH=H-(c.h-mn)/rg*H,yL=H-(c.l-mn)/rg*H;let gr=c.c>=c.o;ctx.strokeStyle=gr?'#00E676':'#ff1744';ctx.fillStyle=gr?'#00E676':'#ff1744';ctx.beginPath();ctx.moveTo(x+w/2,yH);ctx.lineTo(x+w/2,yL);ctx.stroke();let by=Math.min(yO,yC),bh=Math.abs(yO-yC);if(bh<3)bh=3;ctx.fillRect(x,by,w,bh);});}
async function get(){
 let s=document.getElementById('pair').value; document.getElementById('sig').textContent='SCANNING '+s+'...';
 try{
  let r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol='+s+'&interval=1m&limit=80');
  let j=await r.json(); let cl=j.map(k=>parseFloat(k[4])); let ca=j.map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4])}));
  let pr=cl[cl.length-1], pv=cl[cl.length-2]; let rsi=Math.round(calc(cl));
  // SNIPER LOGIC
  let last5=ca.slice(-6,-1); let minL=Math.min(...last5.map(c=>c.l)); let maxH=Math.max(...last5.map(c=>c.h));
  let sweepLow=ca[ca.length-1].l < minL; // liquidity sweep below
  let sweepHigh=ca[ca.length-1].h > maxH; // sweep above
  let bullishEngulf=ca[ca.length-1].c>ca[ca.length-1].o && ca[ca.length-1].c>ca[ca.length-2].o && ca[ca.length-1].o<ca[ca.length-2].c;
  let bearishEngulf=ca[ca.length-1].c<ca[ca.length-1].o && ca[ca.length-1].o>ca[ca.length-2].o && ca[ca.length-1].c<ca[ca.length-2].c;

  let signal, conf, entryTxt='';
  if(mode==='sniper'){
   if(rsi<38 && (sweepLow || bullishEngulf)){
    signal='SNIPER BUY 🟢'; conf=90;
    entryTxt=`✅ <b>SNIPER BUY SETUP FOUND</b><br>1. Liquidity swept: ${sweepLow?'YES - Wick below last 5 lows':'Pullback'}<br>2. RSI ${rsi} - Oversold<br>3. Bullish engulfing: ${bullishEngulf?'YES':'Waiting close'}<br><br><b>ENTRY TO FOLLOW:</b> Wait for 1m candle to close GREEN above ${pr.toFixed(2)}<br>Enter at ${(pr+0.3).toFixed(2)} - ${(pr+0.8).toFixed(2)}<br>SL below sweep: ${(minL-1).toFixed(2)}`;
   } else if(rsi>62 && (sweepHigh || bearishEngulf)){
    signal='SNIPER SELL 🔴'; conf=90;
    entryTxt=`✅ <b>SNIPER SELL SETUP FOUND</b><br>1. Liquidity swept: ${sweepHigh?'YES - Wick above last 5 highs':'Pullback'}<br>2. RSI ${rsi} - Overbought<br>3. Bearish engulfing: ${bearishEngulf?'YES':'Waiting close'}<br><br><b>ENTRY TO FOLLOW:</b> Wait for 1m candle to close RED below ${pr.toFixed(2)}<br>Enter at ${(pr-0.8).toFixed(2)} - ${(pr-0.3).toFixed(2)}<br>SL above sweep: ${(maxH+1).toFixed(2)}`;
   } else {
    signal='WAIT 🟡 NO SNIPER'; conf=55;
    entryTxt=`⏳ No sniper yet. Market is ranging.<br>RSI ${rsi} - Need <38 for BUY sweep or >62 for SELL sweep<br>Last sweep low: ${minL.toFixed(2)} | high: ${maxH.toFixed(2)}<br><b>DO NOT ENTER NOW - Wait for setup</b>`;
   }
  } else {
   // SCALPER
   let isBuy=rsi>50; signal=isBuy?'BUY 🟢':'SELL 🔴'; conf=Math.round(65+Math.abs(rsi-50)*1.5); if(conf>92)conf=92;
   entryTxt=`🎯 <b>SCALPER FOLLOW TREND</b><br>RSI ${rsi} ${isBuy?'>50 uptrend':'<50 downtrend'}<br>Enter NOW at market ${pr.toFixed(2)}<br>Follow 1m green/red close`;
  }

  last={pair:s,price:pr,rsi,signal,conf,entry:entryTxt,time:new Date().toLocaleTimeString(),prev:pv,sweepLow:sweepHigh};

  document.getElementById('p').textContent=pr.toFixed(2); document.getElementById('r').textContent=rsi; document.getElementById('cf').textContent=conf+'%';
  document.getElementById('sig').textContent=signal+' RSI '+rsi; document.getElementById('sig').className='sig '+(signal.includes('BUY')?'buy':signal.includes('SELL')?'sell':'wait');
  document.getElementById('entry').innerHTML=entryTxt;
  let isBuy=signal.includes('BUY'); let tp=isBuy?pr*1.006:pr*0.994, sl=isBuy?pr*0.997:pr*1.003;
  if(mode==='sniper'){tp=isBuy?pr*1.008:pr*0.992; sl=isBuy?minL-0.5:maxH+0.5;}
  document.getElementById('lv').innerHTML=`${pr>pv?'📈 UPTREND':'📉 DOWNTREND'} ${pv.toFixed(2)}→${pr.toFixed(2)}<br>🎯 TP: ${tp.toFixed(2)} | 🛑 SL: ${sl.toFixed(2)}<br>${mode.toUpperCase()} - ${conf}% | 📰 Safe - No news`;

  draw(ca);
 }catch(e){document.getElementById('sig').textContent='Tap SCAN';}
}
function wa(){if(!last.price)return;let t=`💹 ${last.signal} ${last.pair}%0APrice ${last.price} RSI ${last.rsi}%0AConf ${last.conf}%25%0A${last.entry.replace(/<[^>]*>/g,' ')}`;window.open('https://wa.me/254782759185?text='+t);}
get(); setInterval(get,15000);
</script></body></html
