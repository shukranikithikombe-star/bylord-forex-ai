<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYLORD FOREX AI - DUAL MODE</title>
<style>
body{background:#060a14;color:#fff;font-family:Arial;padding:12px}
h1{text-align:center;font-size:24px;margin:8px}
.live{color:#00E676;text-align:center;font-size:11px;border:1px solid #00E676;padding:6px;border-radius:20px;margin:6px auto;max-width:320px}
select{width:100%;padding:14px;background:#1a1f35;color:#fff;border-radius:12px;border:1px solid #2a3555;font-size:15px;margin-bottom:10px}
.modeBox{display:flex;gap:8px;margin:10px 0}
.modeBtn{flex:1;padding:14px;border-radius:12px;border:2px solid #333;background:#1a1f35;color:#888;font-weight:800;font-size:13px}
.modeBtn.active{border-color:#00E676;color:#00E676;background:#0a1f14}
.sig{padding:20px;border-radius:14px;font-size:24px;font-weight:900;text-align:center;margin:10px 0}
.buy{background:#00C853;color:#000}.sell{background:#ff1744;color:#fff}.wait{background:#222840;color:#ffca28}
.box{background:#111827;padding:12px;border-radius:12px;margin:8px 0;text-align:center;color:#ccc;font-size:13px;line-height:1.6}
.btn{width:100%;padding:16px;border-radius:12px;border:none;font-weight:800;font-size:16px;margin-top:8px}
.wa{background:#25D366;color:#fff}.scan{background:#2962FF;color:#fff}
.stat{display:flex;gap:8px;margin:8px 0}.stat div{flex:1;background:#111827;padding:10px;border-radius:10px;text-align:center;font-size:12px}
.stat b{display:block;color:#fff;font-size:16px}
</style></head><body>
<h1>💹 BYLORD FOREX AI</h1>
<div class="live" id="live">● REAL MARKET CONNECTED</div>

<select id="pair">
<option value="BTCUSDT">BTC/USD</option>
<option value="XAUUSD">Gold XAU/USD - Most Signals</option>
<option value="EURUSDT">EUR/USD</option>
<option value="GBPUSDT">GBP/USD</option>
</select>

<div class="modeBox">
<button id="btnScalper" class="modeBtn active" onclick="setMode('scalper')">🎯 SCALPER<br><small>RSI 45/55<br>Many signals</small></button>
<button id="btnSniper" class="modeBtn" onclick="setMode('sniper')">🛡️ SNIPER<br><small>RSI 30/70<br>High accuracy</small></button>
</div>

<div id="sig" class="sig wait">Loading REAL data...</div>

<div class="stat">
<div><b id="priceVal">-</b>REAL PRICE</div>
<div><b id="rsiVal">-</b>RSI(14)</div>
<div><b id="confVal">-</b>CONFIDENCE</div>
</div>

<div id="levels" class="box"></div>
<div id="info" class="box" style="font-size:11px;color:#666"></div>

<button id="waBtn" class="btn wa" style="display:none" onclick="sendWA()">📲 SEND TO +254782759185</button>
<button class="btn scan" onclick="getReal()">🔄 GET REAL SIGNAL NOW</button>

<script>
const NUM="254782759185";
let mode="scalper";
let last={};

function setMode(m){
 mode=m;
 document.getElementById('btnScalper').classList.toggle('active', m==='scalper');
 document.getElementById('btnSniper').classList.toggle('active', m==='sniper');
 getReal();
}

function calcRSI(closes, period=14){
 let gains=0,losses=0;
 for(let i=1;i<=period;i++){ let d=closes[i]-closes[i-1]; if(d>=0) gains+=d; else losses-=d; }
 let avgG=gains/period, avgL=losses/period;
 for(let i=period+1;i<closes.length;i++){ let d=closes[i]-closes[i-1]; if(d>=0){avgG=(avgG*(period-1)+d)/period; avgL=(avgL*(period-1))/period;} else{avgG=(avgG*(period-1))/period; avgL=(avgL*(period-1)-d)/period;} }
 if(avgL===0) return 100; return 100-(100/(1+avgG/avgL));
}

async function getReal(){
 let symbol=document.getElementById('pair').value;
 document.getElementById('sig').textContent="Fetching REAL "+symbol+"...";
 try{
  let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol==="XAUUSD"?"PAXGUSDT":symbol}&interval=1m&limit=21`);
  let j=await r.json();
  let closes=j.map(c=>parseFloat(c[4]));
  let price=closes[closes.length-1];
  let rsi=calcRSI(closes,14); let rsiF=Math.round(rsi);

  let buyLevel = mode==='scalper'?45:30;
  let sellLevel = mode==='scalper'?55:70;

  let signal = rsi<buyLevel?"BUY 🟢":rsi>sellLevel?"SELL 🔴":"WAIT 🟡";
  let conf = mode==='scalper'?(rsi<40||rsi>60?82:68):(rsi<30||rsi>70?94:60);

  last={pair:symbol,price,rsi:rsiF,signal,time:new Date().toLocaleTimeString(),closes};

  document.getElementById('priceVal').textContent=price.toFixed(2);
  document.getElementById('rsiVal').textContent=rsiF;
  document.getElementById('confVal').textContent=conf+"%";

  document.getElementById('sig').textContent=signal+" RSI "+rsiF+" ("+conf+"%)";
  document.getElementById('sig').className="sig "+(signal.includes('BUY')?"buy":signal.includes('SELL')?"sell":"wait");

  if(signal.includes('BUY')||signal.includes('SELL')){
   let tp=signal.includes('BUY')?price*1.003:price*0.997;
   let sl=signal.includes('BUY')?price*0.9985:price*1.0015;
   document.getElementById('levels').innerHTML=`🎯 TP: ${tp.toFixed(2)} | 🛑 SL: ${sl.toFixed(2)} | Mode: ${mode.toUpperCase()}<br><b style='color:#00E676'>${mode==='scalper'?'Quick 0.3% profit':'High quality sniper entry'}</b>`;
   document.getElementById('waBtn').style.display="block";
  }else{
   document.getElementById('levels').innerHTML=`⏸️ WAIT - RSI ${rsiF} between ${buyLevel}-${sellLevel}<br>Switch to SCALPER for more signals`;
   document.getElementById('waBtn').style.display="none";
  }
  document.getElementById('info').textContent=`${closes.length} real 1m candles from Binance • ${mode.toUpperCase()} threshold ${buyLevel}/${sellLevel} • Last: ${closes.slice(-3).map(p=>p.toFixed(1)).join('→')}`;
  document.getElementById('live').textContent=`● LIVE ${new Date().toLocaleTimeString()} - ${symbol} REAL`;
 }catch(e){
  document.getElementById('sig').textContent="Connection error - retrying";
 }
}

function sendWA(){
 let m=`💹 *BYLORD ${mode.toUpperCase()} SIGNAL*%0A%0APair: ${last.pair}%0APrice: ${last.price}%0ASignal: ${last.signal}%0ARSI REAL: ${last.rsi}%0AMode: ${mode}%0ATime: ${last.time}%0A%0A_Real Binance candles_`;
 window.open(`https://wa.me/${NUM}?text=${m}`);
}
getReal();
setInterval(getReal,15000);
</script>
</body></html>
