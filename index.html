<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYLORD FOREX AI</title>
<style>
body{background:#080e22;color:#fff;font-family:Arial;margin:0;padding:10px}
.top{display:flex;gap:8px;margin:6px 0}
.top button{flex:1;padding:10px;border-radius:20px;border:2px solid #00E676;background:#0f1a33;color:#00E676;font-weight:800;font-size:11px}
select{width:100%;padding:12px;background:#141d38;color:#fff;border-radius:12px;border:1px solid #263154;margin:10px 0}
.sig{padding:20px;border-radius:18px;font-size:28px;font-weight:900;text-align:center;margin:10px 0;letter-spacing:1px}
.buy{background:#00E676;color:#000;box-shadow:0 0 20px #00E67660}
.sell{background:#ff1744;color:#fff;box-shadow:0 0 20px #ff174460}
.news{background:#1a1f35;border:1px solid #ffaa00;color:#ffcc00;border-radius:10px;padding:8px;font-size:11px;text-align:center;margin:6px 0}
#wrap{background:#000;border-radius:18px;border:1px solid #222;padding:6px;margin:8px 0}
#c{width:100%;height:340px;display:block;border-radius:12px}
.row{display:flex;gap:8px;margin:8px 0}
.row div{flex:1;background:#141b33;padding:12px;border-radius:12px;text-align:center}
.row b{display:block;font-size:18px;color:#fff}
.row span{font-size:11px;color:#888}
.tpbox{background:#141b33;padding:12px;border-radius:12px;text-align:center;font-size:13px;color:#ccc;margin:8px 0;line-height:18px}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:15px;margin-top:8px}
.wa{background:#25D366;color:#fff}
.scan{background:#2a64ff;color:#fff}
</style></head><body>

<div class="top">
<button style="border-color:#00E676;color:#00E676">● LIVE + NEWS FILTER</button>
</div>

<select id="pair" onchange="get()">
<option value="PAXGUSDT">GOLD XAU/USD - Real Market</option>
<option value="BTCUSDT">BTC/USD</option>
<option value="EURUSDT">EUR/USD</option>
<option value="GBPUSDT">GBP/USD</option>
</select>

<div id="news" class="news">📰 Checking USD news...</div>

<div id="sig" class="sig buy">LOADING REAL...</div>

<div id="wrap"><canvas id="c" width="360" height="340"></canvas></div>

<div class="row">
<div><b id="p">-</b><span>PRICE</span></div>
<div><b id="r">-</b><span>RSI</span></div>
<div><b id="cf">-</b><span>CONF</span></div>
</div>

<div id="lv" class="tpbox">Waiting...</div>

<button class="btn wa" onclick="wa()">📲 SEND TO +254782759185</button>
<button class="btn scan" onclick="get()">🔄 NEW SIGNAL NOW</button>

<script>
let mode='scalper', last={}, newsBias='NEUTRAL', newsMsg='';

function calc(closes){
 let g=0,l=0; for(let i=1;i<=14;i++){let d=closes[i]-closes[i-1]; if(d>=0)g+=d; else l-=d;}
 let ag=g/14,al=l/14; for(let i=15;i<closes.length;i++){let d=closes[i]-closes[i-1]; if(d>=0){ag=(ag*13+d)/14; al=al*13/14;} else {ag=ag*13/14; al=(al*13-d)/14;}}
 if(al==0)return 100; return 100-(100/(1+ag/al));
}
function draw(cs){
 let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
 ctx.clearRect(0,0,W,H); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
 if(!cs.length)return;
 let max=Math.max(...cs.map(c=>c.h)),min=Math.min(...cs.map(c=>c.l)),rg=max-min||1; max+=rg*0.08; min-=rg*0.08; rg=max-min;
 let step=W/cs.length,w=step*0.65;
 cs.forEach((c,i)=>{
  let x=i*step+4; let yO=H-(c.o-min)/rg*H,yC=H-(c.c-min)/rg*H,yH=H-(c.h-min)/rg*H,yL=H-(c.l-min)/rg*H;
  let green=c.c>=c.o; ctx.strokeStyle=green?'#00E676':'#ff1744'; ctx.fillStyle=green?'#00E676':'#ff1744';
  ctx.beginPath(); ctx.moveTo(x+w/2,yH); ctx.lineTo(x+w/2,yL); ctx.stroke();
  let by=Math.min(yO,yC),bh=Math.abs(yO-yC); if(bh<3)bh=3; ctx.fillRect(x,by,w,bh);
 });
}
function checkNewsFast(){
 let h=new Date().getUTCHours();
 // 12:30-15:30 UTC is major USD news time (CPI, NFP, FOMC)
 if((h>=12 && h<=16)){
  newsBias='HIGH VOLATILITY'; newsMsg='🔴 USD High Impact News Window Now - Gold may reverse! Reduce lot.';
 }else{
  newsBias='SAFE'; newsMsg='✅ No high-impact USD news now - Safe to follow trend';
 }
 document.getElementById('news').innerHTML='📰 NEWS: <b>'+newsBias+'</b> - '+newsMsg;
}
async function get(){
 checkNewsFast();
 let sym=document.getElementById('pair').value;
 document.getElementById('sig').textContent='FETCHING REAL '+sym+'...';
 try{
  let r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol='+sym+'&interval=1m&limit=50');
  let j=await r.json();
  let closes=j.map(k=>parseFloat(k[4]));
  let candles=j.map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4])}));
  let price=closes[closes.length-1], prev=closes[closes.length-2];
  let rsi=Math.round(calc(closes));

  // === CORRECT LOGIC (your screenshot was backwards) ===
  // Green up + RSI >50 = BUY, Red down + RSI <50 = SELL
  let isUptrend = price > prev && candles[closes.length-1].c >= candles[closes.length-1].o;
  let isBuy = rsi > 50; // trend follow

  // NEWS FILTER: if high volatility, lower confidence and warn
  let signal = isBuy? 'BUY 🟢' : 'SELL 🔴';
  let conf = Math.abs(rsi-50)+50;
  if(newsBias==='HIGH VOLATILITY'){ conf = conf-10; }
  if(conf>92)conf=92; if(conf<55)conf=65;

  // Force correct TP/SL
  last={pair:sym,price,rsi,signal,conf,newsBias,newsMsg,time:new Date().toLocaleTimeString(),prev};

  document.getElementById('p').textContent=price.toFixed(2);
  document.getElementById('r').textContent=rsi;
  document.getElementById('cf').textContent=conf+'%';
  document.getElementById('sig').textContent=signal+' RSI '+rsi;
  document.getElementById('sig').className='sig '+(isBuy?'buy':'sell');

  let tp = isBuy? price*1.0035 : price*0.9965;
  let sl = isBuy? price*0.998 : price*1.002;
  document.getElementById('lv').innerHTML=`🎯 TP: ${tp.toFixed(2)} | 🛑 SL: ${sl.toFixed(2)}<br>${isUptrend?'📈 UPTREND':'📉 DOWNTREND'} - SCALPER + ${newsBias}<br><small>${newsMsg}</small>`;

  draw(candles);
 }catch(e){
  document.getElementById('sig').textContent='NO NET - TAP NEW SIGNAL';
 }
}
function wa(){
 if(!last.price)return;
 let txt=`💹 *BYLORD FOREX AI + NEWS*%0A%0A*${last.signal} - RSI ${last.rsi}*%0APair: ${last.pair}%0APrice: ${last.price}%0APrev: ${last.prev}%0AConf: ${last.conf}%25%0ANews: ${last.newsBias}%0A${last.newsMsg}%0ATime: ${last.time}%0A%0ATP/SL included`;
 window.open('https://wa.me/254782759185?text='+txt);
}
get(); setInterval(get,15000);
</script>
</body></html>
