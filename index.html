<script>
async function get(){
 let s=document.getElementById('pair').value;
 try{
  let r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol='+s+'&interval=1m&limit=100');
  let j=await r.json();
  let cl=j.map(k=>parseFloat(k[4]));
  let ca=j.map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4])}));
  let pr=cl[cl.length-1];

  // --- RSI ---
  let g=0,l=0;for(let i=1;i<=14;i++){let d=cl[i]-cl[i-1];if(d>=0)g+=d;else l-=d;}
  let ag=g/14,al=l/14;for(let i=15;i<cl.length;i++){let d=cl[i]-cl[i-1];if(d>=0){ag=(ag*13+d)/14;al=al*13/14;}else{ag=ag*13/14;al=(al*13-d)/14;}}
  let rsi=al==0?100:100-(100/(1+ag/al)); rsi=Math.round(rsi);

  // --- BARCHART STYLE: 20 & 50 SMA ---
  let sma20=cl.slice(-20).reduce((a,b)=>a+b,0)/20;
  let sma50=cl.slice(-50).reduce((a,b)=>a+b,0)/50;
  let ema12=cl.slice(-12).reduce((a,b)=>a+b,0)/12;

  // Barchart Trend
  let barchartTrend = pr > sma20 && pr > sma50 && sma20 > sma50? 'BARCHART: STRONG BUY' :
                      pr > sma20? 'BARCHART: BUY' :
                      pr < sma20 && pr < sma50? 'BARCHART: STRONG SELL' : 'BARCHART: HOLD';

  // --- BARCHART OPTIONS LOGIC ---
  // Put/Call proxy: if RSI <45 and price below SMA = Put heavy = bearish reversal soon = BUY sniper
  let putCallRatio = rsi < 45? 'PUTS HEAVY (0.85) - Oversold' : rsi > 65? 'CALLS HEAVY (1.25) - Overbought' : 'NEUTRAL (1.02)';
  let optionsFlow = rsi < 40 && pr < sma20? 'Options Flow: BUY PUTS exhausted → SNIPER BUY coming' :
                    rsi > 65 && pr > sma20? 'Options Flow: BUY CALLS exhausted → SNIPER SELL coming' :
                    'Options Flow: Neutral';

  let isBuy = rsi>50 && pr > sma20;
  let signal = isBuy? 'BUY 🟢' : 'SELL 🔴';
  let conf = Math.round(65 + Math.abs(rsi-50)*1.5); if(conf>92)conf=92;

  // Combine all
  let finalSignal = signal;
  if(barchartTrend.includes('STRONG BUY') && isBuy) { finalSignal='SNIPER BUY 🟢'; conf=90; }
  if(barchartTrend.includes('STRONG SELL') &&!isBuy) { finalSignal='SNIPER SELL 🔴'; conf=90; }

  // Display
  document.getElementById('p').textContent=pr.toFixed(2);
  document.getElementById('r').textContent=rsi;
  document.getElementById('cf').textContent=conf+'%';
  document.getElementById('sig').textContent=finalSignal+' RSI '+rsi;
  document.getElementById('lv').innerHTML=`
  ${barchartTrend}<br>
  SMA20: ${sma20.toFixed(2)} | SMA50: ${sma50.toFixed(2)}<br>
  📊 ${putCallRatio}<br>
  📈 ${optionsFlow}<br><br>
  🎯 TP: ${(isBuy?pr*1.006:pr*0.994).toFixed(2)} | 🛑 SL: ${(isBuy?pr*0.997:pr*1.003).toFixed(2)}<br>
  CONF: ${conf}% - Consider Barchart
  `;

 }catch(e){}
}
</script>
