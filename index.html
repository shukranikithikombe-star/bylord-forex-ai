<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYLORD FOREX AI</title>
<style>
body{background:#060a14;color:#fff;font-family:Arial;padding:10px}
h1{text-align:center;font-size:22px}
.live{color:#00E676;text-align:center;font-size:11px;border:1px solid #00E676;padding:6px;border-radius:20px;margin:6px auto;max-width:320px}
select{width:100%;padding:12px;background:#1a1f35;color:#fff;border-radius:10px;border:1px solid #2a3555;margin-bottom:8px}
.modeBox{display:flex;gap:6px;margin:8px 0}
.modeBtn{flex:1;padding:12px;border-radius:10px;border:2px solid #333;background:#1a1f35;color:#888;font-weight:800;font-size:12px}
.modeBtn.active{border-color:#00E676;color:#00E676;background:#0a1f14}
.sig{padding:20px;border-radius:12px;font-size:26px;font-weight:900;text-align:center;margin:10px 0}
.buy{background:#00C853;color:#000}.sell{background:#ff1744;color:#fff}
#c{width:100%;height:300px;background:#000;border-radius:12px;border:1px solid #222;display:block}
.box{background:#111827;padding:10px;border-radius:10px;margin:6px 0;text-align:center;color:#ccc;font-size:12px}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;margin-top:6px}
.wa{background:#25D366;color:#fff}.scan{background:#2962FF;color:#fff}
.stat{display:flex;gap:6px}.stat div{flex:1;background:#111827;padding:8px;border-radius:8px;text-align:center;font-size:10px}
.stat b{display:block;color:#fff;font-size:14px}
</style></head><body>
<h1>💹 BYLORD FOREX AI</h1>
<div class="live" id="live">● LIVE REAL MARKET</div>
<select id="pair"><option value="PAXGUSDT">Gold XAU/USD</option><option value="BTCUSDT">BTC/USD</option><option value="EURUSDT">EUR/USD</option></select>
<div class="modeBox">
<button id="a" class="modeBtn active" onclick="setMode('scalper')">🎯 SCALPER<br>Always Signal</button>
<button id="b" class="modeBtn" onclick="setMode('sniper')">🛡️ SNIPER<br>High Lot</button>
</div>
<div id="sig" class="sig buy">Loading real...</div>
<canvas id="c" width="360" height="300"></canvas>
<div class="stat"><div><b id="p">-</b>PRICE</div><div><b id="r">-</b>RSI</div><div><b id="cf">-</b>CONF</div></div>
<div id="lv" class="box"></div>
<button class="btn wa" onclick="wa()">📲 SEND TO +254782759185</button>
<button class="btn scan" onclick="get()">🔄 NEW SIGNAL NOW</button>
<script>
let mode='scalper',last={};
function setMode(m){mode=m;document.getElementById('a').classList.toggle('active',m=='scalper');document.getElementById('b').classList.toggle('active',m=='sniper');get();}
function calc(closes){let g=0,l=0;for(let i=1;i<=14;i++){let d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/14,al=l/14;for(let i=15;i<closes.length;i++){let d=closes[i]-closes[i-1];if(d>=0){ag=(ag*13+d)/14;al=al*13/14;}else{ag=ag*13/14;al=(al*13-d)/14;}}if(al==0)return 100;return 100-(100/(1+ag/al));}
function draw(cs){let cv=document.getElementById('c'),x=cv.getContext('2d'),W=cv.width,H=cv.height;x.clearRect(0,0,W,H);x.fillStyle='#000';x.fillRect(0,0,W,H);if(!cs.length)return;let max=Math.max(...cs.map(c=>c.h)),min=Math.min(...cs.map(c=>c.l)),rg=max-min||1;max+=rg*0.1;min-=rg*0.1;rg=max-min;let cw=W/cs.length*0.6;cs.forEach((c,i)=>{let px=i*(W/cs.length)+3;let yo=H-(c.o-min)/rg*H,yc=H-(c.c-min)/rg*H,yh=H-(c.h-min)/rg*H,yl=H-(c.l-min)/rg*H;let gr=c.c>=c.o;x.strokeStyle=gr?'#00C853':'#ff1744';x.fillStyle=gr?'#00C853':'#ff1744';x.beginPath();x.moveTo(px+cw/2,yh);x.lineTo(px+cw/2,yl);x.stroke();let by=Math.min(yo,yc),bh=Math.abs(yo-yc);if(bh<2)bh=2;x.fillRect(px,by,cw,bh);});}
async function get(){let s=document.getElementById('pair').value;document.getElementById('sig').textContent='Fetching REAL '+s+'...';try{let r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol='+s+'&interval=1m&limit=40');let j=await r.json();let cls=j.map(k=>parseFloat(k[4]));let cs=j.map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4])}));let price=cls[cls.length-1],rsi=Math.round(calc(cls)),sig=rsi<50?'BUY 🟢':'SELL 🔴',conf=rsi<40||rsi>60?88:68;last={pair:s,price,rsi,sig,conf,t:new Date().toLocaleTimeString()};document.getElementById('p').textContent=price.toFixed(2);document.getElementById('r').textContent=rsi;document.getElementById('cf').textContent=conf+'%';document.getElementById('sig').textContent=sig+' RSI '+rsi;document.getElementById('sig').className='sig '+(sig.includes('BUY')?'buy':'sell');document.getElementById('lv').innerHTML='🎯 TP: '+(sig.includes('BUY')?price*1.004:price*0.996).toFixed(2)+' | 🛑 SL: '+(sig.includes('BUY')?price*0.998:price*1.002).toFixed(2)+'<br>'+mode.toUpperCase();document.getElementById('live').textContent='● LIVE '+last.t+' REAL '+s;draw(cs);}catch(e){document.getElementById('sig').textContent='Tap NEW SIGNAL - no internet';}}
function wa(){let m=`💹 BYLORD ${mode}%0A${last.sig} ${last.pair}%0APrice: ${last.price}%0ARSI: ${last.rsi}%0ATime: ${last.t}`;window.open('https://wa.me/254782759185?text='+m);}
get();setInterval(get,15000);
</script></body></html>
