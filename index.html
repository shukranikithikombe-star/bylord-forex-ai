<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYLORD FOREX AI - LIVE CANDLES</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#060a14;color:#fff;font-family:Arial;padding:10px;margin:0}
h1{text-align:center;font-size:22px;margin:6px}
.live{color:#00E676;text-align:center;font-size:11px;border:1px solid #00E676;padding:5px;border-radius:20px;margin:5px auto;max-width:300px}
select{width:100%;padding:12px;background:#1a1f35;color:#fff;border-radius:10px;border:1px solid #2a3555;margin-bottom:8px}
.modeBox{display:flex;gap:6px;margin:8px 0}
.modeBtn{flex:1;padding:12px;border-radius:10px;border:2px solid #333;background:#1a1f35;color:#888;font-weight:800;font-size:12px}
.modeBtn.active{border-color:#00E676;color:#00E676;background:#0a1f14}
.sig{padding:16px;border-radius:12px;font-size:22px;font-weight:900;text-align:center;margin:8px 0}
.buy{background:#00C853;color:#000}.sell{background:#ff1744;color:#fff}
#chart{width:100%;height:320px;background:#000;border-radius:12px;border:1px solid #222}
.box{background:#111827;padding:10px;border-radius:10px;margin:6px 0;text-align:center;color:#ccc;font-size:12px}
.btn
