<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYLORD AI</title><style>body{background:#070c1a;color:#fff;font-family:Arial;padding:10px}h1{text-align:center}select{width:100%;padding:12px;background:#151b30;color:#fff;border-radius:10px;margin-bottom:8px}.sig{padding:18px;border-radius:14px;font-size:26px;font-weight:900;text-align:center;margin:10px 0}.buy{background:#00E676;color:#000}.sell{background:#ff1744;color:#fff}#c{width:100%;height:300px;background:#000;border-radius:12px;border:1px solid #222;display:block}.stat{display:flex;gap:6px}.stat div{flex:1;background:#11182b;padding:8px;border-radius:10px;text-align:center;font-size:10px}.stat b{display:block;color:#fff;font-size:14px}.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;margin-top:8px}.wa{background:#25D366;color:#fff}.scan{background:#2962FF;color:#fff}.box{background:#11182b;padding:10px;border-radius:10px;margin:6px 0;text-align:center;font-size:12px}</style></head><body><h1>💹 BYLORD FOREX AI</h1><select id="pair"><option value="PAXGUSDT">GOLD XAU/USD</option><option value="BTCUSDT">BTC/USD</option></select><div id="sig" class="sig buy">LOADING...</div><canvas id="c" width="360" height="300"></canvas><div class="stat"><div><b id="p">-</b>PRICE</div><div><b id="r">-</b>RSI</div><div><b id="n">-</b>NEWS</div></div><div id="lv" class="box"></div><button class="btn wa" onclick="wa()">📲 SEND</button><button class="btn scan" onclick="get()">🔄 NEW SIGNAL NOW</button><script>let last={},nb='NEUTRAL';function calc(cs){let g=0,l=0;for(let i=1;i<=14;i++){let d=cs[i]-cs[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/14,al=l/14;for(let i=15;i<cs.length;i++){let d=cs[i]-cs[i-1];if(d>=0){ag=(ag*13+d)/14;al=al*13/14;}else{ag=ag*13/14;al=(al*13-d)/14;}}if(al==0)return 100;return 100-(100/(1+ag/al));}function draw(cs){let cv=document.getElementById('c'),x=cv.getContext('2d'),W=cv.width,H=cv.height;x.clearRect(0,0,W,H);x.fillStyle='#000';x.fillRect(0,0,W,H);if(!cs.length)return;let mx=Math.max(...cs.map(c=>c.h)),mn=Math.min(...cs.map(c=>c.l)),rg=mx-mn||1;mx+=rg*0.08;mn-=rg*0.08;rg=mx-mn;let st=W/cs.length,w=st*0.6;cs.forEach((c,i)=>{let px=i*st+3;let yO=H-(c.o-mn)/rg*H,yC=H-(c.c-mn)/rg*H,yH=H-(c.h-mn)/rg*H,yL=H-(c.l-mn)/rg*H;let gr=c.c>=c.o;x.strokeStyle=gr?'#00E676':'#ff1744';x.fillStyle=gr?'#00E676':'#ff1744';x.beginPath();x.moveTo(px+w/2,yH);x.lineTo(px+w/2,yL);x.stroke();let by=Math.min(yO,yC),bh=Math.abs(yO-yC);if(bh<2)bh=3;x.fillRect(px,by,w,bh);});}async function get(){let h=new Date().getUTCHours();nb=(h>=12&&h<=15)?'HIGH VOLATILITY':'SAFE - No red news';document.getElementById('n').textContent=nb.split(' ')[0];let s=document.getElementById('pair').value;document.getElementById('sig').textContent='FETCHING '+s+'...';try{let r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol='+s+'&interval=1m&limit=40');let d=await r.json();let cl=d.map(k=>parseFloat(k[4]));let ca=d.map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4])}));let pr=cl[cl.length-1],pv=cl[cl.length-2];let rsi=Math.round(calc(cl));let buy=rsi>50;let sig=buy?'BUY 🟢':'SELL 🔴';last={pair:s,price:pr,rsi,signal:sig,time:new Date().toLocaleTimeString(),prev:pv,news:nb};document.getElementById('p').textContent=pr.toFixed(2);document.getElementById('r').textContent=rsi;document.getElementById('sig').textContent=sig+' RSI '+rsi;document.getElementById('sig').className='sig '+(buy?'buy':'sell');let tp=buy?pr*1.0035:pr*0.9965,sl=buy?pr*0.998:pr*1.002;document.getElementById('lv').innerHTML=(pr>pv?'📈 UPTREND':'📉 DOWNTREND')+' '+pv
