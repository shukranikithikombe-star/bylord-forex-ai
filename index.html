function calcRSI(closes, period=14){
 let gains=0,losses=0;
 for(let i=1;i<=period;i++){ let d=closes[i]-closes[i-1]; if(d>=0) gains+=d; else losses-=d; }
 let avgG=gains/period, avgL=losses/period;
 for(let i=period+1;i<closes.length;i++){ let d=closes[i]-closes[i-1]; if(d>=0){avgG=(avgG*(period-1)+d)/period; avgL=(avgL*(period-1))/period;} else{avgG=(avgG*(period-1))/period; avgL=(avgL*(period-1)-d)/period;} }
 if(avgL===0) return 100; return 100-(100/(1+avgG/avgL));
}
