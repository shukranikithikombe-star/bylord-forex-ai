<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#0a0e14;color:#fff;font-family:Arial;margin:0;padding:10px}
.top{display:flex;gap:8px;margin-bottom:8px}
.top button{flex:1;padding:8px;border-radius:20px;border:1px solid #2a3b2a;background:#121a12;color:#6aff6a;font-size:12px}
.top button.active{background:#1a2e1a;border-color:#4cff4c}
#pairSel{width:100%;padding:10px;border-radius:8px;background:#111827;color:#fff;border:1px solid #333;margin-bottom:8px}
.buyBar{background:#22c55e;color:#000;font-weight:900;text-align:center;padding:12px;border-radius:10px;font-size:18px}
#chart{height:300px;background:#000;border-radius:10px;margin-top:8px}
.info{display:flex;gap:8px;margin-top:8px}
.info div{flex:1;background:#111827;padding:10px;border-radius:10px;text-align:center}
.info b{display:block;font-size:18px}
.trend{background:#0f2314;border:1px solid #1a4d1a;color:#4ade80;padding:8px;border-radius:8px;margin-top:8px;font-size:12px}
</style>
</head>
<body>

<div class="top">
<button class="active">SCALPER</button><button>SNIPER</button><button>BARCHART</button>
</div>

<select id="pairSel" onchange="changePair()">
<option value="BTCUSDT">BTC/USD</option>
<option value="ETHUSDT">ETH/USD</option>
<option value="SOLUSDT">SOL/USD</option>
</select>

<div id="signalBar" class="buyBar">WAITING...</div>
<div id="chart"></div>

<div class="info">
<div><b id="p">-</b><small>PRICE</small></div>
<div><b id="r">-</b><small>RSI</small></div>
<div><b id="cf">-</b><small>CONF</small></div>
</div>

<div id="trendBox" class="trend">BARCHART OPTIONS LIVE<br>Follow trend now</div>

<script>
let chart = LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},timeScale:{timeVisible:true}});
let candleSeries = chart.addCandlestickSeries();
let symbol = "BTCUSDT";
let cl=[], candles=[];

async function loadHistory(){
 let r=await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${symbol}&interval=1m&limit=100`);
 let j=await r.json();
 cl=j.map(k=>parseFloat(k[4]));
 candles=j.map(k=>({time:k[0]/1000, open:parseFloat(k[1]), high:parseFloat(k[2]), low:parseFloat(k[3]), close:parseFloat(k[4])}));
 candleSeries.setData(candles);
 calc();
}
function calc(){
 if(cl.length<50)return;
 let pr=cl[cl.length-1];
 let g=0,l=0;for(let i=1;i<=14;i++){let d=cl[i]-cl[i-1];if(d>=0)g+=d;else l-=d;}
 let ag=g/14,al=l/14;for(let i=15;i<cl.length;i++){let d=cl[i]-cl[i-1];if(d>=0){ag=(ag*13+d)/14;al=al*13/14;}else{ag=ag*13/14;al=(al*13-d)/14;}}
 let rsi=al==0?100:100-(100/(1+ag/al)); rsi=Math.round(rsi);
 let sma20=cl.slice(-20).reduce((a,b)=>a+b,0)/20;
 let sma50=cl.slice(-50).reduce((a,b)=>a+b,0)/50;
 let isBuy = rsi>50 && pr > sma20;
 let conf = Math.round(65 + Math.abs(rsi-50)*1.5); if(conf>92)conf=92;
 let barchart = pr > sma20 && pr > sma50 && sma20 > sma50? 'STRONG BUY' : pr < sma20 && pr < sma50? 'STRONG SELL' : 'HOLD';
 let options = rsi<45?'PUTS HEAVY (0.85)':rsi>65?'CALLS HEAVY (1.25)':'NEUTRAL (1.02)';
 
 document.getElementById('p').textContent=pr.toFixed(2);
 document.getElementById('r').textContent=rsi;
 document.getElementById('cf').textContent=conf+'%';
 document.getElementById('trendBox').innerHTML=`🟢 Follow trend now<br><b>${barchart} | ${options}</b><br>BARCHART OPTIONS LIVE`;
 let final = isBuy?`BUY 🟡 RSI ${rsi}`:`SELL 🔴 RSI ${rsi}`;
 if(barchart=='STRONG BUY' && isBuy) final=`BUY 🟡 RSI ${rsi}`;
 document.getElementById('signalBar').textContent=final;
 document.getElementById('signalBar').style.background=isBuy?'#22c55e':'#ef4444';
}

// LIVE WEBSOCKET - THIS FIXES THE DELAY
let ws;
function startWS(){
 if(ws) ws.close();
 ws=new WebSocket(`wss://stream.binance.vision/ws/${symbol.toLowerCase()}@kline_1m`);
 ws.onmessage=e=>{
  let msg=JSON.parse(e.data);
  let k=msg.k;
  let closeP=parseFloat(k.c);
  cl[cl.length-1]=closeP;
  candles[candles.length-1]={time:candles[candles.length-1].time, open:parseFloat(k.o), high:parseFloat(k.h), low:parseFloat(k.l), close:closeP};
  candleSeries.update(candles[candles.length-1]);
  calc();
 }
}
function changePair(){symbol=document.getElementById('pairSel').value; loadHistory(); startWS();}
loadHistory(); startWS();
</script>
</body>
</html>
