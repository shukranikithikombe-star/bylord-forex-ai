function setMode(m){mode=m;['b1','b2','b3'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',['scalper','sniper','barchart'][i]==m));init();}
function calc(cs){let g=0,l=0;for(let i=1;i<=14;i++){let d=cs[i]-cs[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/14,al=l/14;for(let i=15;i<cs.length;i++){let d=cs[i]-cs[i-1];if(d>=0){ag=(ag*13+d)/14;al=al*13/14;}else{ag=ag*13/14;al=(al*13-d)/14;}}if(al==0)return 70;return 100-(100/(1+ag/al));}
function draw(cs,entry,tp,sl,isBuy){
 let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(!cs.length)return;
 let mx=Math.max(...cs.map(c=>c.h),entry||0,tp||0,sl||0),mn=Math.min(...cs.map(c=>c.l),entry||9e9,tp||9e9,sl||9e9);if(!isFinite(mx))mx=4499;if(!isFinite(mn))mn=4460;let rg=mx-mn||20;mx+=rg*0.2;mn-=rg*0.2;rg=mx-mn;let yP=p=>H-(p-mn)/rg*H;

 let st=W/cs.length,w=st*0.65;cs.forEach((c,i)=>{let x=i*st+2;let yO=yP(c.o),yC=yP(c.c),yH=yP(c.h),yL=yP(c.l);let gr=c.c>=c.o;ctx.strokeStyle=gr?'#00E676':'#ff1744';ctx.fillStyle=gr?'#00E676':'#ff1744';ctx.beginPath();ctx.moveTo(x+w/2,yH);ctx.lineTo(x+w/2,yL);ctx.stroke();let by=Math.min(yO,yC),bh=Math.abs(yO-yC);if(bh<2)bh=2;ctx.fillRect(x,by,w,bh);});
}
