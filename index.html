<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYLORD FOREX AI</title><link rel="manifest" href="manifest.json">
<style>body{background:#0a0e1a;color:white;font-family:Arial;text-align:center;padding:15px}
.card{background:#151a2a;border-radius:20px;padding:20px;margin:15px 0}
.buy{background:#00C853;color:black;font-size:26px;padding:18px;border-radius:15px;font-weight:bold}
.sell{background:#D50000;color:white;font-size:26px;padding:18px;border-radius:15px;font-weight:bold}
.wait{background:#333;color:#FFC400;padding:15px;border-radius:15px}
.btn{width:100%;padding:18px;border-radius:15px;border:none;font-size:18px;font-weight:bold}
.wa{background:#25D366;color:white}</style></head><body>
<h1>💹 BYLORD FOREX AI</h1><p>WhatsApp +254782759185</p>
<select id="pair" style="width:100%;padding:12px;border-radius:10px;background:#222;color:white">
<option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>Gold XAU/USD</option><option>BTC/USD</option></select>
<div id="signalBox" class="wait" style="margin-top:15px">Scanning...</div>
<div id="details" style="margin:10px;color:#aaa"></div>
<div id="waCard" style="display:none"><button class="btn wa" onclick="sendWA()">📲 SEND TO MY WHATSAPP</button></div>
<button class="btn" style="background:#2962FF;color:white;margin-top:10px" onclick="scan()">🔄 Scan Now</button>
<script>
let MY_NUMBER="254782759185";let curSig="",curPrice=0,curPair="";
function scan(){let p=document.getElementById('pair').value;curPair=p;
let base={"EUR/USD":1.085,"GBP/USD":1.275,"USD/JPY":149.5,"Gold XAU/USD":2650,"BTC/USD":67500};
let price=base[p]+(Math.random()-0.5)*0.02;curPrice=price;
let rsi=Math.floor(Math.random()*80)+15;
let sig=rsi<33?"BUY 🟢":rsi>67?"SELL 🔴":"WAIT 🟡";
curSig=sig;let box=document.getElementById('signalBox');
box.innerText=sig+" - RSI "+rsi;box.className=sig.includes("BUY")?"buy":sig.includes("SELL")?"sell":"wait";
document.getElementById('details').innerText="Price: "+price.toFixed(4)+" | "+new Date().toLocaleTimeString();
document.getElementById('waCard').style.display=sig.includes("WAIT")?"none":"block";}
function sendWA(){let m=`BYLORD FOREX AI%0APair: ${curPair}%0ASignal: ${curSig}%0APrice: ${curPrice.toFixed(4)}`;window.open(`https://wa.me/${MY_NUMBER}?text=${m}`);}
scan();setInterval(scan,30000);
</script></body></html>
