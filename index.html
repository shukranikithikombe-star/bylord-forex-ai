<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYLORD AI FINAL</title>
<style>
body{background:#080e22;color:#fff;font-family:Arial;margin:0;padding:10px}
.sig{padding:20px;border-radius:18px;font-size:28px;font-weight:900;text-align:center;margin:10px 0}
.buy{background:#00E676;color:#000;box-shadow:0 0 20px #00E67660}.sell{background:#ff1744;color:#fff;box-shadow:0 0 20px #ff174460}
#wrap{background:#000;border-radius:18px;border:1px solid #222;padding:6px;margin:8px 0}
#c{width:100%;height:360px;display:block;border-radius:12px}
.row{display:flex;gap:8px;margin:8px 0}.row div{flex:1;background:#141b33;padding:12px;border-radius:12px;text-align:center}
.row b{display:block;font-size:18px}.row span{font-size:11px;color:#888}
.tpbox{background:#141b33;padding:12px;border-radius:12px;text-align:center;font-size:13px;color:#ccc;margin:8px 0;line-height:18px}
.news{color:#ffcc00;font-size:11px;margin-top:4px}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:15px;margin-top:8px}
.wa{background:#25D366;color:#fff}.scan{background:#2a64ff;color:#fff}
select{width:100%;padding:12px;background:#141d38;color:#fff;border-radius:12px;border:1px solid #263154;margin:10px 0}
</style></head><body>
<select id="pair" onchange="get()"><option value="PAXGUSDT">GOLD XAU/USD</option><option value="BTCUSDT">BTC/USD</option><option value="EURUSDT">EUR/USD</option></select>
<div id="sig" class="sig buy">LOADING...</div>
<div id="wrap"><canvas id="c" width="360" height="360"></canvas></div>
<div class="row"><div><b id="p">-</b><span>REAL PRICE</span></div><div><b id="r">-</b><span>RSI 14</span></div><div><b id="cf">-</b><span>CONFIDENCE</span></div></div>
<div id="lv" class="tpbox"></div>
<button class="btn wa" onclick="wa()">📲 SEND TO +254782759185</button>
<button class="btn scan" onclick="get()">🔄 NEW SIGNAL NOW</button>
<script>
let last={},news='';function calc(cs){let g=0,l=0;for(let i=1;i<=14;i++){let d=cs[i]-cs[i-1];if(d>=0)g+=d;else l-=d;}let ag=g/14,al=l/14;for(let i=15;i<cs.length;i++){let d=cs[i]-cs[i-1];if(d>=0){ag=(ag*13+d)/14;al=al*13/14;}else{ag=ag*13/14;al=(al*13-d)/14;}}if(al==0)return 100;return 100-(100/(1+ag/al));}
function draw(cs){let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(!cs.length)return;let mx=Math.max(...cs.map(c=>c.h)),mn=Math.min(...cs.map(c=>c.l)),rg=mx-mn||1;mx+=rg*0.08;mn-=rg*0.08;rg=mx-mn;let st=W/cs.length,w=st*0.6;cs.forEach((c,i)=>{let x=i*st+4;let yO=H-(c.o-mn)/rg*H,yC=H-(c.c-mn)/rg*H,yH=H-(c.h-mn)/rg*H,yL=H-(c.l-mn)/rg*H;let gr=c.c>=c.o;ctx.strokeStyle=gr?'#00E676':'#ff1744';ctx.fillStyle=gr?'#00E676':'#ff1744';ctx.beginPath();ctx.moveTo(x+w/2,yH);ctx.lineTo(x+w/2,yL);ctx.stroke();let by=Math.min(yO,yC),bh=Math.abs(yO-yC);if(bh<3)bh=3;ctx.fillRect(x,by,w,bh);});}
async function get(){
 let h=new Date().getUTCHours(); let isNewsTime=h>=12&&h<=16;
 news=isNewsTime?'🔴 NEWS TIME: High volatility - wait for candle close':'✅ No high-impact news - safe trend';
 let s=document.getElementById('pair').value;
 document.getElementById('sig').textContent='FETCHING...';
 try{
  let r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol='+s+'&interval=1m&limit=60');
  let j=await r.json(); let cl=j.map(k=>parseFloat(k[4])); let ca=j.map(k=>({o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4])}));
  let pr=cl[cl.length-1], pv=cl[cl.length-2]; let rsi=Math.round(calc(cl));
  // CORRECT TREND: RSI >50 = BUY, <50 = SELL
  let isBuy=rsi>50; let sig=isBuy?'BUY 🟢':'SELL 🔴';
  let conf=rsi>60||rsi<40?88:rsi>55||rsi<45?72:59;
  if(isNewsTime)conf-=8;
  last={pair:s,price:pr,rsi,signal:sig,conf,news,time:new Date().toLocaleTimeString(),prev:pv};
  document.getElementById('p').textContent=pr.toFixed(2); document.getElementById('r').textContent=rsi; document.getElementById('cf').textContent=conf+'%';
  document.getElementById('sig').textContent=sig+' RSI '+rsi; document.getElementById('sig').className='sig '+(isBuy?'buy':'sell');
  let tp=isBuy?pr*1.0035:pr*0.9965, sl=isBuy?pr*0.998:pr*1.002;
  document.getElementById('lv').innerHTML=`📈 ${pr>pv?'UPTREND':'DOWNTREND'} | ${pv.toFixed(2)} → ${pr.toFixed(2)}<br>🎯 TP: ${tp.toFixed(2)} | 🛑 SL: ${sl.toFixed(2)}<br>SCALPER - ${conf}% CONFIDENCE<br><div class="news">📰 ${news}</div>`;
  draw(ca);
 }catch(e){document.getElementById('sig').textContent='Tap NEW SIGNAL';}
}
function wa(){if(!last.price)return;let t=`💹 BYLORD AI%0A${last.signal} RSI ${last.rsi}%0A${last.pair} ${last.price}%0A${last.news}%0AConf ${last.conf}%`;window.open('https://wa.me/254782759185?text='+t);}
get(); setInterval(get,15000);
</script></body></html>
